name: Build LNXV Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Bootstrap Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

      - name: Run unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --console=plain > test.log 2>&1
          code=$?
          python3 .github/scripts/test_summary.py
          if [ $code -ne 0 ]; then
            grep -E "^e: |FAILED|What went wrong|Execution failed|AssertionError|expected" test.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code

      - name: Android lint (non-blocking until the baseline is clean)
        continue-on-error: true
        run: ./gradlew lintDebug --console=plain

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/lnxv.jks

      - name: Build Release APK with Gradle
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/lnxv.jks
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set +e
          ./gradlew assembleRelease --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Execution failed|Could not|FAILED|Caused by" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code

      - name: Rename APK and write SHA-256 checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk LNXV.apk
          sha256sum LNXV.apk > LNXV.apk.sha256
          cat LNXV.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LNXV-app-release
          path: |
            LNXV.apk
            LNXV.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (for in-app updates)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LNXV 1.0.${{ github.run_number }}
          files: |
            LNXV.apk
            LNXV.apk.sha256
          generate_release_notes: true
