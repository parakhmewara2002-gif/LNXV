name: Build LNXV Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fail loudly if the native decoder build is missing instead of silently shipping an APK without it.
      ORG_GRADLE_PROJECT_requireNativeDecoders: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Bootstrap Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

      - name: Install NDK, CMake and meson/ninja (pinned in decoders/tools/versions.env)
        run: |
          source decoders/tools/versions.env
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          pip install --user meson ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore native decoder build cache
        id: native-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            decoders/src/main/jni/third_party/out
            decoders/src/main/jni/third_party/cpu_features
            decoders/src/main/jniLibs
          key: native-decoders-${{ runner.os }}-${{ hashFiles('decoders/tools/**') }}

      - name: Build native decoders (FFmpeg LGPL audio + dav1d) on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: decoders/tools/build_all.sh arm64-v8a armeabi-v7a

      # Saved right after the build (not at job end) so a later failing step does not throw the slow build away.
      - name: Save native decoder build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            decoders/src/main/jni/third_party/out
            decoders/src/main/jni/third_party/cpu_features
            decoders/src/main/jniLibs
          key: native-decoders-${{ runner.os }}-${{ hashFiles('decoders/tools/**') }}

      # Robolectric downloads its android-all jar from Maven at test time; cache it so a Maven hiccup cannot fail the build.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Run unit tests
        run: |
          set +e
          ./gradlew testSideloadDebugUnitTest --console=plain > test.log 2>&1
          code=$?
          # Retry when the failure is a transient dependency/Robolectric download issue (network), never for real test failures.
          if [ $code -ne 0 ] && grep -q -E "MavenArtifactFetcher|Could not download|Could not resolve all files" test.log; then
            echo "Transient dependency download failed; retrying with --stacktrace"
            sleep 20
            ./gradlew testSideloadDebugUnitTest --console=plain > test.log 2>&1
            code=$?
          fi
          python3 .github/scripts/test_summary.py
          if [ $code -ne 0 ]; then
            grep -A3 -E "^e: |FAILED|What went wrong|Execution failed|AssertionError|expected" test.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code

      - name: Upload panel render screenshots (for review, not a golden comparison)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      # The enhancer's fragment shaders are generated in Kotlin; a unit test writes them to app/build/shaders.
      - name: Validate GLSL shaders (glslangValidator)
        run: |
          if ! (sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools); then
            echo "::warning::glslang-tools could not be installed; shader validation skipped"
            exit 0
          fi
          ls app/build/shaders/*.vert app/build/shaders/*.frag
          for f in app/build/shaders/*.vert app/build/shaders/*.frag; do
            echo "validating $f"
            glslangValidator "$f"
          done

      - name: Android lint (non-blocking until the baseline is clean)
        continue-on-error: true
        run: ./gradlew lintSideloadDebug --console=plain

      - name: Compile benchmark module (not run; needs a device)
        run: ./gradlew :benchmark:assembleBenchmark --stacktrace

      - name: Static analysis - detekt + ktlint (non-blocking until findings are triaged)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/sa" analysis
          curl -fsSL -o "$RUNNER_TEMP/sa/detekt.jar" https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7-all.jar
          java -jar "$RUNNER_TEMP/sa/detekt.jar" --input app/src/main/java --config .github/detekt.yml --build-upon-default-config \
            --report txt:analysis/detekt.txt --report html:analysis/detekt.html || true
          curl -fsSL -o "$RUNNER_TEMP/sa/ktlint" https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x "$RUNNER_TEMP/sa/ktlint"
          "$RUNNER_TEMP/sa/ktlint" "app/src/main/java/**/*.kt" --reporter=plain > analysis/ktlint.txt || true
          echo "detekt findings: $(grep -c . analysis/detekt.txt 2>/dev/null || echo 0)"
          echo "ktlint findings: $(grep -c . analysis/ktlint.txt 2>/dev/null || echo 0)"

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-analysis
          path: analysis/
          if-no-files-found: ignore

      # PR code is untrusted: build the release variants with the debug key and never expose signing secrets.
      - name: Build unsigned release variants for pull requests
        if: github.event_name == 'pull_request'
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleSideloadRelease assembleStoreRelease bundleStoreRelease --stacktrace --console=plain

      - name: Decode signing keystore (trusted pushes only)
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/lnxv.jks"

      - name: Build signed release variants (trusted pushes only)
        if: github.event_name != 'pull_request'
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/lnxv.jks
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set +e
          ./gradlew assembleSideloadRelease assembleStoreRelease bundleStoreRelease --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Execution failed|Could not|FAILED|Caused by" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code

      - name: Verify native libraries in the APK and report sizes (measured)
        run: |
          set -e
          APK=app/build/outputs/apk/sideload/release/app-sideload-release.apk
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libavcodec.so libavutil.so libswresample.so libffmpegJNI.so libdav1dJNI.so; do
              unzip -l "$APK" "lib/$abi/$lib" | grep -q "lib/$abi/$lib" || { echo "::error::lib/$abi/$lib missing from APK"; exit 1; }
            done
          done
          if unzip -l "$APK" | grep -q "lib/x86_64/"; then echo "::error::x86_64 libs must not be in release"; exit 1; fi
          {
            echo '### Native libraries in sideload release APK (uncompressed bytes per file)'
            echo '```'
            unzip -l "$APK" 'lib/*' | awk 'NR>3 && $1 ~ /^[0-9]+$/ {print $1, $4}'
            echo '```'
            echo '### Artifact sizes'
            echo '```'
            for f in app/build/outputs/apk/sideload/release/*.apk app/build/outputs/apk/store/release/*.apk app/build/outputs/bundle/storeRelease/*.aab; do
              [ -f "$f" ] && echo "$(du -b "$f" | cut -f1) bytes  $f"
            done
            echo '```'
          } | tee sizes.md >> "$GITHUB_STEP_SUMMARY"
          cat sizes.md

      - name: Verify 16 KB ELF and APK alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/sideload/release/app-sideload-release.apk
          NDK_DIR="$ANDROID_HOME/ndk"
          READELF="$(find "$NDK_DIR" -path '*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf' -type f | sort -V | tail -n1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n1)"
          test -x "$READELF"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 4 "$APK"
          while IFS= read -r entry; do
            tmp="$RUNNER_TEMP/16k-${entry//\//-}"
            unzip -p "$APK" "$entry" > "$tmp"
            "$READELF" -lW "$tmp" | python3 -c '
          import sys
          loads = [line.split()[-1] for line in sys.stdin if line.lstrip().startswith("LOAD")]
          aligns = [int(value, 16) for value in loads]
          if not aligns or any(value < 0x4000 for value in aligns):
              raise SystemExit(f"16 KB ELF alignment failure: {aligns}")
          '
            rm -f "$tmp"
            echo "16 KB ELF aligned: $entry"
          done < <(unzip -Z1 "$APK" | grep -E '^lib/.+/.+\.so$')
      - name: Rename APK and write SHA-256 checksum
        run: |
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk LNXV.apk
          sha256sum LNXV.apk > LNXV.apk.sha256
          cat LNXV.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LNXV-app-release
          path: |
            LNXV.apk
            LNXV.apk.sha256
          if-no-files-found: error


  publish-release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LNXV-app-release
          path: release
      - name: Publish GitHub Release (for in-app updates)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LNXV 1.0.${{ github.run_number }}
          files: |
            release/LNXV.apk
            release/LNXV.apk.sha256
          generate_release_notes: true
