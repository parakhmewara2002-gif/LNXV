name: Build LNXV Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Bootstrap Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

      - name: Run unit tests
        run: |
          set +e
          ./gradlew testSideloadDebugUnitTest --console=plain > test.log 2>&1
          code=$?
          python3 .github/scripts/test_summary.py
          if [ $code -ne 0 ]; then
            grep -E "^e: |FAILED|What went wrong|Execution failed|AssertionError|expected" test.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code

      - name: Android lint (non-blocking until the baseline is clean)
        continue-on-error: true
        run: ./gradlew lintSideloadDebug --console=plain

      - name: Compile benchmark module (not run; needs a device)
        run: ./gradlew :benchmark:assembleBenchmark --stacktrace

      - name: Static analysis - detekt + ktlint (non-blocking until findings are triaged)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/sa" analysis
          curl -fsSL -o "$RUNNER_TEMP/sa/detekt.jar" https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7-all.jar
          java -jar "$RUNNER_TEMP/sa/detekt.jar" --input app/src/main/java --config .github/detekt.yml --build-upon-default-config \
            --report txt:analysis/detekt.txt --report html:analysis/detekt.html || true
          curl -fsSL -o "$RUNNER_TEMP/sa/ktlint" https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x "$RUNNER_TEMP/sa/ktlint"
          "$RUNNER_TEMP/sa/ktlint" "app/src/main/java/**/*.kt" --reporter=plain > analysis/ktlint.txt || true
          echo "detekt findings: $(grep -c . analysis/detekt.txt 2>/dev/null || echo 0)"
          echo "ktlint findings: $(grep -c . analysis/ktlint.txt 2>/dev/null || echo 0)"

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-analysis
          path: analysis/
          if-no-files-found: ignore

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/lnxv.jks

      - name: Build Release APK with Gradle
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/lnxv.jks
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set +e
          ./gradlew assembleSideloadRelease assembleStoreRelease --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Execution failed|Could not|FAILED|Caused by" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code

      - name: Rename APK and write SHA-256 checksum
        run: |
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk LNXV.apk
          sha256sum LNXV.apk > LNXV.apk.sha256
          cat LNXV.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LNXV-app-release
          path: |
            LNXV.apk
            LNXV.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (for in-app updates)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LNXV 1.0.${{ github.run_number }}
          files: |
            LNXV.apk
            LNXV.apk.sha256
          generate_release_notes: true
